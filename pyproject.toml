[project]
name = "horta"
version = "0.1.0"
description = "Xestión integral de explotacións agrarias e gandeiras: rexistro da actividade, caderno de explotación, CUE e trazabilidade"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "babel>=2.17",
    "bcrypt>=5.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "nicegui>=3.17.1",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "segno>=1.6.6",
    "shapely>=2.2.0",
    "sqlalchemy>=2.0.54",
    "weasyprint>=70.0",
]

[project.scripts]
horta = "horta.main:main"
horta-catalogos = "horta.cli_catalogos:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
